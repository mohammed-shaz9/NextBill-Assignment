version: "3.8"

services:
  api:
    build: .
    container_name: nextbill-classifier
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=training/trained_model.pkl
      - VECTORIZER_PATH=training/vectorizer.pkl
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
